<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- ARORA ESPORTS Angular Crest Emblem -->
  <defs>
    <linearGradient id="aroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00D9FF" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield Polygon -->
  <polygon points="50,6 92,24 82,78 50,96 18,78 8,24" fill="#071A20" stroke="#18333A" stroke-width="2.5" />
  <!-- Inner Dynamic Angular "A" Blades -->
  <path d="M50 18 L76 72 L62 72 L50 46 L38 72 L24 72 Z" fill="url(#aroraGrad)" filter="url(#neonGlow)" />
  <!-- Center Energy Core Notch -->
  <polygon points="50,32 58,56 42,56" fill="#050B10" />
  <polygon points="50,44 54,58 46,58" fill="#00F5A0" />
</svg>
